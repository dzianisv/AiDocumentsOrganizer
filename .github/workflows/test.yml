name: Test OCR Document Classification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Tesseract OCR
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-ukr
        tesseract --version
        tesseract --list-langs
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pytesseract
        pip install langchain langchain-openai langchain-google-genai langchain-community
        pip install pydantic
    
    - name: Download test receipts
      run: |
        # Create test-images directory
        mkdir -p test-images
        
        # Download Safeway receipt sample
        curl -L "https://raw.githubusercontent.com/tesseract-ocr/test/main/testing/eurotext.png" -o test-images/sample_text.png || true
        
        # For CI, we'll use generated test images instead of real receipts
        python3 scripts/generate_test_receipts.py
    
    - name: Run OCR classification tests
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python3 scripts/run_tests.py
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          test-images/
          test-results.json